services:
  - type: web
    name: dc-scanner-api-nattapol
    runtime: python
    plan: standard
    region: singapore
    buildCommand: pip install -r requirements.txt
    # ⚡ Standard Plan: 1 CPU dedicated
    # gunicorn + UvicornWorker = stable process manager + fast async workers
    # 2 workers (recommended: 2 × CPU cores) + 120s keep-alive
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GOOGLE_CLOUD_PROJECT
        value: pro-analytics-db
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/bq-key.json
