# Render Free ปิดเครื่องเองหลังไม่มี traffic 15 นาที ทำให้คำขอแรกรอ 30-60 วินาที
# workflow นี้ ping ทุก 10 นาที เฉพาะเวลาทำงาน จึงกัน cold start ได้โดยไม่กินโควตา
# instance hours ของ Render Free (750 ชม./เดือน)
#
#   06:00-20:00 เวลาไทย = 23:00-13:00 UTC  ->  ~15 ชม./วัน
#   จ.-ส. (UTC 1-6) x ~26 วัน              ->  ~390 ชม./เดือน  < 750 ชม.
#
# ถ้าต้องการเปลี่ยนเวลา แก้ cron ด้านล่าง (เป็น UTC เสมอ) แล้วคิดชั่วโมงรวมใหม่ให้ < 750
name: Keep Render awake

on:
  schedule:
    # ทุก 10 นาที ในชั่วโมง UTC 23:00-23:59 (= 06:00-06:59 ไทย) ของ จ.-ส.
    - cron: "*/10 23 * * 0-5"
    # ทุก 10 นาที ในชั่วโมง UTC 00:00-12:59 (= 07:00-19:59 ไทย) ของ จ.-ส.
    - cron: "*/10 0-12 * * 1-6"
  workflow_dispatch:

# ไม่ต้องอ่าน/เขียน repo เลย
permissions: {}

# ถ้ารอบก่อนยังค้าง ให้ข้ามรอบใหม่ ไม่ต้องต่อคิว
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          # --max-time 90 เผื่อกรณีที่เครื่องเพิ่งหลับไปแล้วต้องบูตใหม่จริง ๆ
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 \
            https://backed-api-scan-uat.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/health.json; echo
          # ไม่ทำให้ workflow แดงเพราะ Render สะดุดชั่วคราว รอบถัดไปอีก 10 นาที
          if [ "$code" != "200" ]; then
            echo "::warning::health check returned $code"
          fi
